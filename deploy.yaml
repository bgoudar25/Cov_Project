name: Build and Deploy Infrastructure

on:
  push:
    branches: [master] 
  pull_request:
    branches: [master]
  workflow_dispatch:

# Allow OIDC authentication with AWS (more secure than storing access keys)
permissions:
  id-token: write  # Required for requesting the JWT
  contents: read  # Required to checkout repository code

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

# Environment variables used throughout the workflow
env:
  # AWS configuration
  AWS_REGION : "eu-central-1"  # Define target deployment region
  AWS_ROLE_ARN_DEV: "arn:aws:iam::196615020824:role/GitHubActions-cicd-Role-qa"  # Role for dev/QA environments
  AWS_ROLE_ARN_PROD: "arn:aws:iam::091489542225:role/GitHubActions-cicd-Role-prod"  # Role for production environment
  PROJECT_NAME: "biwikiapp"  # Used for stack naming
  SAM_CLI_TELEMETRY: 0  # Disable AWS SAM telemetry for privacy

jobs:
  # ============================================
  # BUILD & LINT
  # ============================================
  build:
    name: Lint and Build Application
    runs-on: cov-shared
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv venv
          source venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV

          pip install aws-sam-cli boto3 cfn-flip cfn-lint --quiet
          gem install multi_json -v 1.15.0
          gem install cfn-nag -v 0.8.10

      - name: Run linters
        run: bash scripts/linter/run-linters.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build application
        run: |
          sam build -t infrastructure/infrastructure.yaml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          include-hidden-files: true  # Required to preserve .aws-sam hidden directory
          if-no-files-found: error  # Fail if no files found to upload
          path: |
            ${{ github.workspace }}/.aws-sam/**
            ${{ github.workspace }}/infrastructure/config/*.conf

  # ============================================
  # DEPLOY TO QA
  # ============================================
  deploy_qa:
    name: Deploy to QA
    needs: build
    environment: qa
    runs-on: cov-shared
    # Only run on direct push to master branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install SAM CLI
        run: |
          python -m venv venv
          source venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV
          pip install aws-sam-cli --quiet

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600  # Token valid for 1 hour

      # Deploy to QA environment using environment-specific parameters
      - name: Deploy with SAM
        run: |
          echo "Deploying to QA..."
          PARAMS=$(cat infrastructure/config/qa.conf | jq -r '.Parameters | to_entries | map(select(.value != "")) | map("\(.key)=\(.value)") | join(" ")')
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ${{ env.PROJECT_NAME }}-qa \
            --parameter-overrides ${PARAMS} \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset

  # # ============================================
  # # CREATE PROD CHANGESET
  # # ============================================
  create_prod_changeset:
    name: Create Prod Changeset
    needs: deploy_qa
    # environment: prod  # Uncomment to trigger approval also for changeset creation
    runs-on: cov-shared
    # Only run on direct push to master branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install SAM CLI
        run: |
          python -m venv venv
          source venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV
          pip install aws-sam-cli --quiet

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600  # Token valid for 1 hour
      
      - name: Create PROD Changeset
        run: |
          echo "Creating changeset for PROD..."
          PARAMS=$(cat infrastructure/config/prod.conf | jq -r '.Parameters | to_entries | map(select(.value != "")) | map("\(.key)=\(.value)") | join(" ")')
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ${{ env.PROJECT_NAME }}-prod \
            --parameter-overrides ${PARAMS} \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --resolve-s3 \
            --no-execute-changeset

  # ============================================
  # DEPLOY TO PROD
  # ============================================
  deploy_prod:
    name: Deploy to Prod
    needs: create_prod_changeset
    environment: prod
    runs-on: cov-shared
    # Only run on direct push to master branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install SAM CLI
        run: |
          python -m venv venv
          source venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV
          pip install aws-sam-cli --quiet

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600  # Token valid for 1 hour

      # # Deploy to production environment using production-specific parameters
      - name: Deploy with SAM
        run: |
          echo "Deploying to Prod..."
          PARAMS=$(cat infrastructure/config/prod.conf | jq -r '.Parameters | to_entries | map(select(.value != "")) | map("\(.key)=\(.value)") | join(" ")')
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ${{ env.PROJECT_NAME }}-prod \
            --parameter-overrides ${PARAMS} \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset