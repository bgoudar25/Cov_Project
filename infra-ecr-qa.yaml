AWSTemplateFormatVersion: 2010-09-09
Description: Deploy ECR Repository in QA Account

Parameters:
  RepositoryName:
    Type: String
    Default: biwiki-code

  RepositoryNameBase:
    Type: String
    Default: biwiki-php-base

Resources:
  ECRBiWiKi: 
    Type: AWS::ECR::Repository
    Properties: 
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration: 
        ScanOnPush: true
      RepositoryName: !Ref RepositoryName
      RepositoryPolicyText: 
        Version: 2012-10-17
        Statement: 
          - 
            Sid: AllowQAAccountAccess
            Effect: Allow
            Principal: 
              Service: 
                - codebuild.amazonaws.com
                - ecs-tasks.amazonaws.com
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: 
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:GetAuthorizationToken
              - ecr:Describe*
              - ecr:List*

  ECRPHPBaseRepo: 
    Type: AWS::ECR::Repository
    Properties: 
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration: 
        ScanOnPush: true
      RepositoryName: !Ref RepositoryNameBase
      RepositoryPolicyText: 
        Version: 2012-10-17
        Statement: 
          - 
            Sid: AllowQAAccountAccess
            Effect: Allow
            Principal: 
              Service: 
                - codebuild.amazonaws.com
                - ecs-tasks.amazonaws.com
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: 
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:GetAuthorizationToken
              - ecr:Describe*
              - ecr:List*

Outputs:
  QAECRBiWiki:
    Value: !GetAtt ECRBiWiKi.RepositoryUri
    Export:
      Name: QAECRBiWiki
      
  QAECRPHPBaseRepo:
    Value: !GetAtt ECRPHPBaseRepo.RepositoryUri
    Export:
      Name: QAECRPHPBaseRepo
