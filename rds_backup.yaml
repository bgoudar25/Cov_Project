AWSTemplateFormatVersion: 2010-09-09
Description: RDS infrastructure backup setup

Parameters:
  BackupRetentionPeriod:
    Type: Number
    Description: Days to retain snapshots of RDS
  ServiceName:
    Description: The name of the application to roll out
    Type: String
  Stage:
    Description: Stage of the application
    Type: String
  BackupTag:
    Description: Tag to identify RDS for backups
    Type: String

Resources:
  ## Creates a new IAM role for Backup
  BackupRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service:
                - "backup.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
      Tags:
        - Key: Name
          Value: !Sub "${ServiceName}-${Stage}-BackupRole-RDS"

  ## This resource specifies an encryption key for daily backup in AWS Key Management Service (AWS KMS).
  KMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "Encryption key for daily backup"
      EnableKeyRotation: True
      Enabled: True
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              "AWS": { "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action:
              - kms:*
            Resource: "*"

  ## Creates a logical container where backups are stored.
  BackupVaultWithDailyBackups:
    Type: "AWS::Backup::BackupVault"
    DeletionPolicy: Retain
    Properties:
      BackupVaultName: !Sub "${ServiceName}RDSBackupVaultWithDailyBackups"
      EncryptionKeyArn: !GetAtt KMSKey.Arn

  ## Backup Rules based on which daily backups will be performed
  BackupPlanWithDailyBackups:
    Type: "AWS::Backup::BackupPlan"
    Properties:
      BackupPlan:
        BackupPlanName: !Sub "${ServiceName}RDSBackupPlanWithDailyBackups"
        BackupPlanRule:
          -
            RuleName: !Sub "${ServiceName}-${Stage}-RDSBackupRule"
            TargetBackupVault: !Ref BackupVaultWithDailyBackups
            ScheduleExpression: cron(0 5 ? * MON,WED,FRI *)
            Lifecycle:
              DeleteAfterDays: !Ref BackupRetentionPeriod
            StartWindowMinutes: 60
            CompletionWindowMinutes: 120
            RecoveryPointTags:
              cov:ami-enforcement-exception: backup 

  ## Specifies a set of resources to assign to  a backup plan.  
  TagBasedBackupSelection:
    Type: "AWS::Backup::BackupSelection"
    Properties:
      BackupSelection:
        SelectionName: !Sub "${ServiceName}-${Stage}-RDSBackupSelection"
        IamRoleArn: !GetAtt BackupRole.Arn
        ListOfTags:
         -
           ConditionType: "STRINGEQUALS"
           ConditionKey: "BackupSelector"
           ConditionValue: !Ref BackupTag
      BackupPlanId: !Ref BackupPlanWithDailyBackups